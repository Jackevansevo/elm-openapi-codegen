openapi: 3.0.4
info:
  title: Books
  version: 1.0.0
paths: {}
components:
  schemas:
    Book:
      type: object
      required:
        - author
        - bookId
        - bookTitle
      properties:
        author:
          type: object
          required:
            - name
          properties:
            name:
              type: string
            website:
              type: string
              nullable: true
        bookId:
          type: string
        bookTitle:
          type: string
        inPrint:
          type: boolean
        tags:
          type: array
          items:
            type: string
